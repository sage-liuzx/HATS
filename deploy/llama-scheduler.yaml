apiVersion: v1
kind: Namespace
metadata:
  name: llama-scheduler
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llama-scheduler
  namespace: llama-scheduler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: llama-scheduler-role
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "pods/binding", "pods/status", "events"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: llama-scheduler-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: llama-scheduler-role
subjects:
  - kind: ServiceAccount
    name: llama-scheduler
    namespace: llama-scheduler
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: scheduler-config
  namespace: llama-scheduler
data:
  scheduler-config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    leaderElection:
      leaderElect: false
    profiles:
      - schedulerName: llama-scheduler
        plugins:
          score:
            enabled:
              - name: "LlamaTimeScore"
                weight: 5
        pluginConfig:
          - name: LlamaTimeScore
            args:
              timeWeight: 0.2
              queueWeight: 0.3
              utilWeight: 0.5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-scheduler
  namespace: llama-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-scheduler
  template:
    metadata:
      labels:
        app: llama-scheduler
    spec:
      serviceAccountName: llama-scheduler
      nodeSelector:
        kubernetes.io/hostname: arm207
      containers:
        - name: scheduler
          image: ghcr.io/sage-liuzx/llama-scheduler:arm64
          imagePullPolicy: Always
          command:
            - /bin/kube-scheduler
          args:
            - --config=/etc/kubernetes/scheduler-config.yaml
            - -v=2
          volumeMounts:
            - name: config
              mountPath: /etc/kubernetes
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: scheduler-config
