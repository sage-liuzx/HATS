apiVersion: batch/v1
kind: CronJob
metadata:
  name: predictor-finetune
  namespace: llama-scheduler
spec:
  # 每小时整点触发一次
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: finetune
              image: ghcr.io/sage-liuzx/token-predictor:arm64
              imagePullPolicy: Always
              command:
                - python
                - online_finetune.py
                - --feedback
                - /data/feedback.jsonl
                - --model
                - /app/model
                - --threshold
                - "500"
              volumeMounts:
                - name: feedback
                  mountPath: /data
                - name: model
                  mountPath: /app/model
          volumes:
            - name: feedback
              persistentVolumeClaim:
                claimName: predictor-feedback-pvc
            - name: model
              persistentVolumeClaim:
                claimName: predictor-model-pvc
